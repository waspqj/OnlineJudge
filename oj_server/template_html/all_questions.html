<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线OJ - 题库</title>
    <style>
        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #1e1e1e;
            --bg-tertiary: #2a2a2a;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-muted: #6b6b6b;
            --border: #333333;
            --accent: #3a3a3a;
            --hover-bg: #2c2c2c;
            --green: #00b8a3;
            --yellow: #ffc01e;
            --red: #ff375f;
            --radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 导航栏 */
        .navbar {
            display: flex;
            align-items: center;
            height: 56px;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            gap: 12px;
        }

        .navbar a {
            display: inline-block;
            padding: 8px 16px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.15s ease;
        }

        .navbar a:hover {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .navbar .login {
            margin-left: auto;
        }

        /* 题目列表区域 */
        .question_list {
            margin-top: 30px;
        }

        .question_list h1 {
            font-size: 28px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 25px;
            letter-spacing: -0.3px;
        }

        /* 表格卡片 */
        .table-wrapper {
            background-color: var(--bg-secondary);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
            table-layout: auto;
        }

        thead {
            background-color: var(--bg-tertiary);
        }

        th {
            padding: 14px 20px;
            text-align: left;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 14px 20px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
            transition: background-color 0.12s ease;
        }

        tbody tr:hover td {
            background-color: var(--hover-bg);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        /* 题号列 */
        td:first-child,
        th:first-child {
            width: 80px;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* 标题列 */
        td:nth-child(2) a {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.15s ease;
        }

        td:nth-child(2) a:hover {
            color: #4da3ff;
            text-decoration: underline;
        }

        /* 难度标签 */
        .difficulty {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #fff;
            background-color: var(--green);
            /* 默认绿色，会被JS覆盖 */
        }

        .difficulty.easy {
            background-color: var(--green);
        }

        .difficulty.medium {
            background-color: var(--yellow);
            color: #000;
        }

        .difficulty.hard {
            background-color: var(--red);
        }

        /* 页脚 */
        .footer {
            text-align: center;
            padding: 40px 0;
            color: var(--text-muted);
            font-size: 13px;
        }
    </style>
</head>

<body>
    <!-- 导航栏 -->
    <div class="navbar">
        <a href="/">首页</a>
        <a href="/questions">题库</a>
        <a href="#">竞赛</a>
        <a href="#">讨论</a>
        <a href="#">求职</a>
        <a class="login" href="#">登录</a>
    </div>

    <div class="container">
        <div class="question_list">
            <h1>题库</h1>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>编号</th>
                            <th>题目</th>
                            <th>难度</th>
                        </tr>
                    </thead>
                    <tbody>
                        {{#question_list}}
                        <tr>
                            <td>{{number}}</td>
                            <td><a href="/question/{{number}}">{{title}}</a></td>
                            <td><span class="difficulty">{{star}}</span></td>
                        </tr>
                        {{/question_list}}
                    </tbody>
                </table>
            </div>
        </div>
        <div class="footer">
            © 2026 Online Judge · 基于自研高并发服务器
        </div>
    </div>

    <script>
        // 根据难度文本自动添加对应的样式类，无需修改后端
        document.querySelectorAll('.difficulty').forEach(function(el) {
            var text = el.textContent.trim();
            if (text === '易' || text === 'Easy' || text === 'easy' || text === '简单') {
                el.classList.add('easy');
            } else if (text === '中' || text === 'Medium' || text === 'medium' || text === '中等') {
                el.classList.add('medium');
            } else if (text === '难' || text === 'Hard' || text === 'hard' || text === '困难') {
                el.classList.add('hard');
            }
        });
    </script>
</body>

</html>
