<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Judge</title>
    <style>
        :root {
            --bg-primary: #16161A;
            --bg-secondary: #1F2128;
            --bg-tertiary: #2A2D35;
            --text-primary: #E8ECF1;
            --text-secondary: #A1AAB6;
            --text-muted: #6B7386;
            --border: #353B48;
            --accent: #7C8B9C;
            --accent-hover: #95A5B0;
            --green: #6B9B7D;
            --green-hover: #7FB594;
            --radius: 12px;
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ── 导航栏 ── */
        .navbar {
            width: 100%;
            height: 60px;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 8px;
        }

        .navbar .logo {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-right: 32px;
            letter-spacing: 0.5px;
        }

        .navbar a {
            display: inline-block;
            padding: 8px 20px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            border-radius: 8px;
            transition: all var(--transition);
        }

        .navbar a:hover {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .navbar .nav-right {
            margin-left: auto;
            display: flex;
            gap: 8px;
        }

        /* ── 英雄区域 ── */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 80px 24px 60px;
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .hero h1 span {
            color: var(--accent);
        }

        .hero p {
            font-size: 18px;
            color: var(--text-secondary);
            max-width: 560px;
            line-height: 1.7;
            margin-bottom: 40px;
        }

        .hero .cta-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .hero .btn {
            display: inline-block;
            padding: 14px 36px;
            font-size: 15px;
            font-weight: 600;
            border-radius: var(--radius);
            text-decoration: none;
            transition: all var(--transition);
            letter-spacing: 0.3px;
        }

        .btn-primary {
            background-color: var(--green);
            color: #FAFAFA;
        }

        .btn-primary:hover {
            background-color: var(--green-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(107, 155, 125, 0.25);
        }

        .btn-secondary {
            background-color: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background-color: var(--border);
            color: var(--text-primary);
        }

        /* ── 特性卡片 ── */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            padding: 0 0 80px;
        }

        .feature-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 24px;
            transition: all var(--transition);
        }

        .feature-card:hover {
            border-color: var(--accent);
        }

        .feature-card .icon {
            font-size: 28px;
            margin-bottom: 16px;
        }

        .feature-card h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .feature-card p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* ── 页脚 ── */
        .footer {
            text-align: center;
            padding: 32px 0;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">OJ</div>
        <a href="/">首页</a>
        <a href="/questions">题库</a>
        <a href="#">竞赛</a>
        <a href="#">讨论</a>
        <div class="nav-right">
            <a href="#">登录</a>
            <a href="#">注册</a>
        </div>
    </div>

    <div class="hero">
        <h1>一个<span>简洁</span>的Online Judge平台</h1>
        <p>专注算法练习，支持 C/C++ 代码提交与实时评测 </p>
        <div class="cta-group">
            <a href="/questions" class="btn btn-primary">进入题库</a>
            <a href="#" class="btn btn-secondary">了解更多</a>
        </div>
    </div>

    <div class="features container">
        <div class="feature-card">
            <div class="icon">⚡</div>
            <h3>高性能判题</h3>
            <p>基于自研高并发 TCP 框架构建，毫秒级编译与运行，支持大规模并发提交。</p>
        </div>
        <div class="feature-card">
            <div class="icon">🔒</div>
            <h3>安全沙箱</h3>
            <p>使用进程隔离与资源限制技术，保证服务器不被恶意代码侵入，稳定运行。</p>
        </div>
        <div class="feature-card">
            <div class="icon">📊</div>
            <h3>即时反馈</h3>
            <p>提交后立刻获得编译错误、超时、通过或答案错误的详细结果，快速迭代。</p>
        </div>
    </div>

    <div class="footer">
        <p>© 2026 Online Judge · 基于自研 C++ 高并发服务器构建</p>
    </div>
</body>
</html>
